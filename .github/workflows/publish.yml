name: Publish npm
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm publish --access public --provenance
